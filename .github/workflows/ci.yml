
name: DevOps CI Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests and Generate JSON Report
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -v --json-report --json-report-file=pytest-report.json

      - name: Send Detailed Test Report to Receiver
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          import requests

          report_file = Path("pytest-report.json")

          if not report_file.exists():
              raise SystemExit("Pytest JSON report was not generated.")

          if not os.environ.get("REPORT_URL") or not os.environ.get("REPORT_TOKEN"):
              raise SystemExit("REPORT_URL or REPORT_TOKEN secret is missing.")

          report = json.loads(report_file.read_text(encoding="utf-8"))
          raw_tests = report.get("tests", [])

          test_results = []

          for test in raw_tests:
              failure_message = None

              for phase in ("setup", "call", "teardown"):
                  phase_data = test.get(phase) or {}
                  if phase_data.get("longrepr"):
                      failure_message = str(phase_data["longrepr"])
                      break

              test_results.append({
                  "name": test.get("nodeid", "Unknown test"),
                  "result": test.get("outcome", "unknown"),
                  "failure_message": failure_message
              })

          passed = sum(t["result"] == "passed" for t in test_results)
          failed = sum(t["result"] == "failed" for t in test_results)
          total = len(test_results)
          overall_status = "PASSED" if failed == 0 and report.get("exitcode") == 0 else "FAILED"

          timestamp = datetime.now(timezone.utc).isoformat()

          report["execution_timestamp"] = timestamp
          report["repository"] = os.environ["GITHUB_REPOSITORY"]
          report["branch"] = os.environ["GITHUB_REF_NAME"]
          report["commit_sha"] = os.environ["GITHUB_SHA"]
          report["pipeline_run_id"] = os.environ["GITHUB_RUN_ID"]
          report["overall_status"] = overall_status
          report["test_results"] = test_results

          report["summary"] = {
              "total": total,
              "passed": passed,
              "failed": failed,
              "overall_status": overall_status
          }

          report["github"] = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"]
          }

          response = requests.post(
              os.environ["REPORT_URL"],
              json=report,
              headers={"X-Report-Token": os.environ["REPORT_TOKEN"]},
              timeout=30
          )

          print("Receiver response:", response.status_code, response.text)
          response.raise_for_status()
          print("Detailed test report delivered successfully.")
          print("Overall status:", overall_status)
          print("Total:", total, "Passed:", passed, "Failed:", failed)
          PY

      - name: Send Email Test Report
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import ssl
          import smtplib
          from pathlib import Path
          from datetime import datetime, timezone
          from email.message import EmailMessage

          required = ["MAIL_USERNAME", "MAIL_PASSWORD", "MAIL_TO"]

          for key in required:
              if not os.environ.get(key):
                  raise SystemExit(f"Required GitHub secret {key} is missing.")

          report_file = Path("pytest-report.json")

          if not report_file.exists():
              raise SystemExit("Pytest JSON report is missing.")

          report = json.loads(report_file.read_text(encoding="utf-8"))
          tests = report.get("tests", [])

          passed = sum(t.get("outcome") == "passed" for t in tests)
          failed = sum(t.get("outcome") == "failed" for t in tests)
          skipped = sum(t.get("outcome") == "skipped" for t in tests)
          total = len(tests)

          status = (
              "PASSED"
              if failed == 0 and report.get("exitcode") == 0
              else "FAILED"
          )

          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          lines = [
              "AUTOMATED ASSIGNMENT SUBMISSION PORTAL",
              "DEVOPS CI PIPELINE TEST REPORT",
              "",
              f"Overall Status: {status}",
              f"Repository: {os.environ['GITHUB_REPOSITORY']}",
              f"Branch: {os.environ['GITHUB_REF_NAME']}",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Workflow Run ID: {os.environ['GITHUB_RUN_ID']}",
              f"Execution Timestamp: {timestamp}",
              "",
              "TEST SUMMARY",
              f"Total Tests: {total}",
              f"Passed: {passed}",
              f"Failed: {failed}",
              f"Skipped: {skipped}",
              "",
              "INDIVIDUAL TEST RESULTS"
          ]

          for test in tests:
              name = test.get("nodeid", "Unknown test")
              outcome = test.get("outcome", "unknown").upper()
              lines.append(f"{outcome}: {name}")

              if outcome == "FAILED":
                  for phase in ("setup", "call", "teardown"):
                      phase_data = test.get(phase) or {}
                      if phase_data.get("longrepr"):
                          lines.append(f"Failure details ({phase}):")
                          lines.append(str(phase_data["longrepr"]))
                          break

          if failed == 0:
              lines.extend(["", "Failure Details: No failed tests."])

          body = "\n".join(lines)

          message = EmailMessage()
          message["Subject"] = (
              f"[{status}] DevOps CI Test Report - "
              f"{os.environ['GITHUB_REPOSITORY']}"
          )
          message["From"] = os.environ["MAIL_USERNAME"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(body)

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              timeout=30,
              context=context
          ) as server:
              server.login(
                  os.environ["MAIL_USERNAME"],
                  os.environ["MAIL_PASSWORD"]
              )
              server.send_message(message)

          print("Email test report sent successfully.")
          print("Overall status:", status)
          print(f"Total: {total}, Passed: {passed}, Failed: {failed}, Skipped: {skipped}")
          PY

      - name: Mark Pipeline Failed if Tests Failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "Automated tests failed. Check the delivered JSON report."
          exit 1

  deploy-pages:
    name: Deploy GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
